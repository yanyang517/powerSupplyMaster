schema: spec-driven

context: |
  Language: 简体中文
  All artifacts must be written in 简体中文.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Git 工作流约束（适用于所有 change）:
  - master 是唯一的主分支。任何合入 master 的操作 MUST 使用非 fast-forward 合并（git merge --no-ff），以保留分支拓扑和合并记录；MUST NOT 依赖 --ff 或 --ff-only。
  - 功能开发与 bug 修复 MUST 优先在 git worktree 建立的独立工作目录中进行，避免污染主工作区；仅当 worktree 确实不可行时才允许在主工作区就地开分支，并需在 proposal 中说明原因。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - 开始实施前 MUST 用 git worktree 为本次 change 建立独立工作目录，并在其上创建功能/修复分支；不要直接在主工作区实施。
      - 完成后 MUST 以 git merge --no-ff 合入 master，并在汇报中说明实际使用的合并方式。
