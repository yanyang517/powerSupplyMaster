[pytest]
# One configuration for both `python -m pytest src` and focused file runs.
pythonpath = src packages/psu-mcp
testpaths = src packages/psu-mcp/tests

# Default gate: unit tests plus self-contained integration tests.
# Real serial tests must be explicitly selected with `-m hardware`.
addopts = -m "not hardware" -ra

markers =
    integration: end-to-end tests with an in-process TCP server and simulated SCPI peer
    hardware: tests requiring a real serial device selected by PSM_TEST_SERIAL_PORT

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

log_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
