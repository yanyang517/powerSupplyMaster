name: Release Windows executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # scripts/build_exe.ps1 refuses to run without .venv at the repository root,
      # so CI reproduces the local layout instead of patching the script.
      - name: Create virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/python.exe -m pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Package archive
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $archive = "powerSupplyMaster-$version-windows-x64.zip"
          Compress-Archive -Path dist/powerSupplyMaster -DestinationPath $archive
          "ARCHIVE=$archive" >> $env:GITHUB_ENV
          Write-Host "Archive: $archive ($([math]::Round((Get-Item $archive).Length / 1MB, 1)) MB)"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" $env:ARCHIVE --generate-notes --title "$env:GITHUB_REF_NAME"
