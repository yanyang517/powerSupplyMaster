name: Release Windows executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            packages/psu-mcp/pyproject.toml

      # scripts/build_exe.ps1 refuses to run without .venv at the repository root,
      # so CI reproduces the local layout instead of patching the script.
      - name: Create virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/python.exe -m pip install -r requirements.txt
          .venv/Scripts/python.exe -m pip install -e packages/psu-mcp

      - name: Check release manifest
        shell: pwsh
        run: |
          # 版本真源、update/latest.json 与 tag 三方对齐；对不齐就别浪费时间构建。
          # tag 来源：tag 触发时是 GITHUB_REF_NAME，dispatch 时退回本地 HEAD tag。
          .venv/Scripts/python.exe scripts/gen_manifest.py --check

      - name: Test suite gate
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          # Unit + self-contained integration tests must pass before spending time on a build.
          .venv/Scripts/python.exe -m pytest src -q
          .venv/Scripts/python.exe -m pytest packages/psu-mcp/tests -q

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Package archive
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $archive = "powerSupplyMaster-$version-windows-x64.zip"
          Compress-Archive -Path dist/powerSupplyMaster -DestinationPath $archive
          "ARCHIVE=$archive" >> $env:GITHUB_ENV
          Write-Host "Archive: $archive ($([math]::Round((Get-Item $archive).Length / 1MB, 1)) MB)"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" $env:ARCHIVE --generate-notes --title "$env:GITHUB_REF_NAME"

      - name: Sync mirror code and tag to Gitee
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.GITEE_TOKEN != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          MIRROR_URL: https://yanyang517:${{ secrets.GITEE_TOKEN }}@gitee.com/yanyang517/power-supply-master.git
        run: |
          # "只读镜像"的意思是人不用往它推代码，不是流水线也不推：清单从两个 raw URL 读，
          # 镜像落后于 tag 就等于一半用户收不到公告，最后那道 --remote 回读正是为此而红。
          # 只允许快进——被 Gitee Go 那类自动提交挡住时报错交人工处置，流水线里不强推。
          # continue-on-error：Gitee 侧本来就在自动同步 GitHub 代码，这一跳只是兜底；
          # 不能让它失败顺带吃掉后面真正目标所在的制品镜像步骤。
          git push $env:MIRROR_URL "HEAD:refs/heads/master" "${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"

      - name: Mirror artifact to Gitee
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.GITEE_TOKEN != '' }}
        shell: pwsh
        run: |
          # 国内下载入口：GitHub Release 之外，Gitee 同名发行版挂同一个包。
          # attach_files 属于"能用但没写进官方文档"的接口，所以脚本上传完一定回读发行版确认。
          .venv/Scripts/python.exe scripts/sync_release_to_gitee.py --tag "$env:GITHUB_REF_NAME" --file "$env:ARCHIVE"

      - name: Note skipped Gitee mirror
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.GITEE_TOKEN == '' }}
        shell: pwsh
        run: echo "::warning::未配置 GITEE_TOKEN，本次未镜像到 Gitee，国内仍只能从 GitHub 下载"

      - name: Read back published manifests
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          # 应用只会"不提示"，不会因为清单没推上去而报错，所以这里替它把话说完：
          # 用应用实际会用的两个 raw URL 回读，版本对不上 tag 就是发布没到位。
          .venv/Scripts/python.exe scripts/gen_manifest.py --remote --tag "$env:GITHUB_REF_NAME"
