name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            packages/psu-mcp/pyproject.toml

      - name: Create virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/python.exe -m pip install -r requirements.txt
          .venv/Scripts/python.exe -m pip install -e packages/psu-mcp

      - name: Default test gate
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pytest src -q
          .venv/Scripts/python.exe -m pytest packages/psu-mcp/tests -q

      - name: Hardware layer skips without an explicit serial port
        shell: pwsh
        run: .venv/Scripts/python.exe -m pytest src -q -m hardware
